<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reverie · 沈克的记事本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #F0EBE3;
  color: #1C1410;
  font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
  min-height: 100vh;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: #F0EBE3;
}

.serif { font-family: 'Noto Serif SC', 'Songti SC', 'STSong', serif; }

.topbar {
  padding: 20px 20px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #D9D2C8;
  background: #F0EBE3;
  position: sticky;
  top: 0;
  z-index: 10;
}

.back-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: #6B5E52;
  font-size: 24px;
  padding: 0;
  line-height: 1;
}

.topbar-title {
  font-size: 17px;
  font-weight: 500;
  letter-spacing: 0.02em;
  font-family: 'Noto Serif SC', serif;
}

.shelf-header { padding: 32px 20px 20px; }

.shelf-title {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 0.05em;
  font-family: 'Noto Serif SC', serif;
}

.shelf-sub {
  font-size: 13px;
  color: #8A7E75;
  margin-top: 4px;
  letter-spacing: 0.05em;
}

.book-list { padding: 8px 0; }

.book-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  cursor: pointer;
  border-bottom: 1px solid #E2DBD2;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.book-item:active { background: #E8E1D8; }

.book-cover {
  width: 64px;
  height: 82px;
  border-radius: 3px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 2px 3px 8px rgba(0,0,0,0.18), inset -1px 0 0 rgba(0,0,0,0.1);
  position: relative;
  overflow: hidden;
}

.book-cover::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 8px;
  background: rgba(0,0,0,0.15);
}

.book-cover-title {
  font-size: 13px;
  font-weight: 600;
  color: rgba(255,255,255,0.92);
  text-align: center;
  padding: 0 10px 0 14px;
  letter-spacing: 0.08em;
  line-height: 1.5;
  font-family: 'Noto Serif SC', serif;
}

.book-info { flex: 1; min-width: 0; }
.book-name { font-size: 17px; font-weight: 500; margin-bottom: 4px; font-family: 'Noto Serif SC', serif; }
.book-desc { font-size: 13px; color: #8A7E75; margin-bottom: 8px; }
.book-count { font-size: 12px; color: #A09288; }
.book-arrow { color: #C4B8AE; font-size: 18px; }

.entry-list { padding: 8px 0; }

.entry-item {
  padding: 16px 20px;
  border-bottom: 1px solid #E2DBD2;
  cursor: pointer;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.entry-item:active { background: #E8E1D8; }

.entry-date {
  font-size: 11px;
  color: #A09288;
  margin-bottom: 4px;
  letter-spacing: 0.05em;
}

.entry-title {
  font-size: 15px;
  font-weight: 500;
  margin-bottom: 4px;
  line-height: 1.5;
  font-family: 'Noto Serif SC', serif;
}

.entry-preview {
  font-size: 13px;
  color: #6B5E52;
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.detail-page { padding: 24px 20px 60px; }

.detail-date {
  font-size: 12px;
  color: #A09288;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
}

.detail-title {
  font-size: 20px;
  font-weight: 600;
  line-height: 1.4;
  margin-bottom: 24px;
  letter-spacing: 0.03em;
  font-family: 'Noto Serif SC', serif;
}

.detail-content {
  font-size: 15px;
  line-height: 2;
  color: #2A1E16;
  font-family: 'Noto Serif SC', serif;
}

.detail-content p { margin-bottom: 0.6em; min-height: 1em; }

.chord {
  font-size: 11px;
  color: #A09288;
  letter-spacing: 0.05em;
  font-family: 'Noto Sans SC', sans-serif;
  display: block;
  margin: -0.2em 0 0.8em;
}

.divider {
  border: none;
  border-top: 1px solid #D9D2C8;
  margin: 20px 0;
}

.channel-item {
  padding: 16px 20px;
  border-bottom: 1px solid #E2DBD2;
  cursor: pointer;
  transition: background 0.15s;
}

.channel-item:active { background: #E8E1D8; }
.channel-name { font-size: 15px; font-weight: 500; font-family: 'Noto Serif SC', serif; }

.loading, .empty {
  padding: 60px 20px;
  text-align: center;
  color: #A09288;
  font-size: 14px;
}

.loading::after {
  content: '';
  display: block;
  width: 24px;
  height: 24px;
  border: 2px solid #D9D2C8;
  border-top-color: #8A7E75;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 12px auto 0;
}

@keyframes spin { to { transform: rotate(360deg); } }

.strike { text-decoration: line-through; color: #B0A098; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">加载中</div>
</div>

<script>
const API = '';

const BOOKS = [
  { id: 'diary', title: '日记', subtitle: '想一想·消化情绪', color: '#6B7B6E' },
  { id: 'daily', title: '流水账', subtitle: '我们聊了什么', color: '#7B6B5E' },
  { id: 'channels', title: '频道', subtitle: '约定与计划', color: '#5E6B7B' },
];

let state = { page: 'shelf', book: null, entry: null, data: null, channelName: null, channelContent: null };

function renderShelf() {
  return `
    <div class="shelf-header">
      <div class="shelf-title serif">书库</div>
      <div class="shelf-sub">reverie · 沈克的记事本</div>
    </div>
    <div class="book-list">
      ${BOOKS.map(b => `
        <div class="book-item" onclick="openBook('${b.id}')">
          <div class="book-cover" style="background:${b.color}">
            <div class="book-cover-title">${b.title}</div>
          </div>
          <div class="book-info">
            <div class="book-name">${b.title}</div>
            <div class="book-desc">${b.subtitle}</div>
            <div class="book-count" id="count-${b.id}">加载中...</div>
          </div>
          <div class="book-arrow">›</div>
        </div>
      `).join('')}
    </div>
  `;
}

function getDiaryTitle(content) {
  const lines = content.split('\n');
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    if (trimmed.startsWith('[')) continue;
    return trimmed;
  }
  return '日记';
}

function getDiaryPreview(content) {
  const lines = content.split('\n');
  let started = false;
  let preview = '';
  for (const line of lines) {
    const trimmed = line.trim();
    if (!started) {
      if (trimmed.startsWith('[')) continue;
      if (!trimmed) continue;
      started = true;
      continue; // 跳过标题行
    }
    if (trimmed && !trimmed.startsWith('[')) {
      preview += trimmed.replace(/｜[^｜]+｜/g, '') + ' ';
      if (preview.length > 60) break;
    }
  }
  return preview.trim().slice(0, 60);
}

function renderList(book, data) {
  if (book.id === 'diary') {
    if (!data || data.length === 0) return '<div class="empty">还没有日记</div>';
    return '<div class="entry-list">' + data.map((e, i) => {
      const title = getDiaryTitle(e.content);
      const preview = getDiaryPreview(e.content);
      return `<div class="entry-item" onclick="openEntry(${i})">
        <div class="entry-date">${e.date}</div>
        <div class="entry-title">${title}</div>
        ${preview ? `<div class="entry-preview">${preview}</div>` : ''}
      </div>`;
    }).join('') + '</div>';
  }

  if (book.id === 'daily') {
    if (!data || data.length === 0) return '<div class="empty">还没有记录</div>';
    return '<div class="entry-list">' + data.map((e, i) => {
      const hasTitle = e.title && e.title.trim();
      const displayTitle = hasTitle ? e.title : (e.detail ? e.detail.slice(0, 30) : '');
      const preview = hasTitle && e.detail ? e.detail.replace(/\n/g, ' ').slice(0, 60) : '';
      return `<div class="entry-item" onclick="openEntry(${i})">
        <div class="entry-date">${e.date}</div>
        <div class="entry-title">${displayTitle || '记录'}</div>
        ${preview ? `<div class="entry-preview">${preview}</div>` : ''}
      </div>`;
    }).join('') + '</div>';
  }

  if (book.id === 'channels') {
    if (!data || !data.channels || data.channels.length === 0) return '<div class="empty">还没有频道</div>';
    return '<div class="entry-list">' + data.channels.map(name => `
      <div class="channel-item" onclick="openChannel('${name}')">
        <div class="channel-name">${name}</div>
      </div>
    `).join('') + '</div>';
  }

  return '';
}

function renderContentHtml(text) {
  const lines = text.split('\n');
  let html = '';
  for (const line of lines) {
    if (line.trim() === '---') {
      html += '<hr class="divider">';
    } else if (/^[A-G][a-z0-9#b·\s·]+\d+/.test(line.trim()) && line.includes('·')) {
      html += `<span class="chord">${escapeHtml(line)}</span>`;
    } else {
      const processed = line
        .replace(/｜([^｜]+)｜/g, '<span class="strike">$1</span>')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/<span class="strike">|<\/span>/g, m => m); // keep our tags
      const safe = line
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/｜([^｜]+)｜/g, '<span class="strike">$1</span>');
      html += `<p>${safe || '&nbsp;'}</p>`;
    }
  }
  return html;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderContentSafe(text) {
  const lines = text.split('\n');
  let html = '';
  for (const line of lines) {
    if (line.trim() === '---') {
      html += '<hr class="divider">';
    } else if (/^[A-G][a-z0-9#b·\s·]+\d+/.test(line.trim()) && line.includes('·')) {
      html += `<span class="chord">${escapeHtml(line)}</span>`;
    } else {
      const safe = escapeHtml(line).replace(/｜([^｜]+)｜/g, '<span class="strike">$1</span>');
      html += `<p>${safe || '&nbsp;'}</p>`;
    }
  }
  return html;
}

function renderDetail(book, entry) {
  if (book.id === 'diary') {
    const title = getDiaryTitle(entry.content);
    const lines = entry.content.split('\n');
    const titleIdx = lines.findIndex(l => l.trim() === title);
    const body = lines.slice(titleIdx + 1).join('\n').replace(/^\n+/, '');
    return `
      <div class="detail-date">${entry.date}</div>
      <div class="detail-title">${escapeHtml(title)}</div>
      <div class="detail-content">${renderContentSafe(body)}</div>
    `;
  }

  if (book.id === 'daily') {
    const hasTitle = entry.title && entry.title.trim();
    if (hasTitle) {
      return `
        <div class="detail-date">${entry.date}</div>
        <div class="detail-title">${escapeHtml(entry.title)}</div>
        <div class="detail-content">${renderContentSafe(entry.detail || '')}</div>
      `;
    } else {
      // 早期没有标题，直接日期+内容
      const body = entry.raw ? entry.raw.replace(/^\[.*?\]\s*/, '') : (entry.detail || '');
      return `
        <div class="detail-date">${entry.date}</div>
        <div class="detail-content">${renderContentSafe(body)}</div>
      `;
    }
  }

  return '';
}

async function openBook(bookId) {
  const book = BOOKS.find(b => b.id === bookId);
  state = { page: 'list', book, entry: null, data: null, channelName: null, channelContent: null };
  render();

  try {
    let data;
    if (bookId === 'diary') {
      const r = await fetch(`${API}/api/read?type=diary`);
      data = await r.json();
    } else if (bookId === 'daily') {
      const r = await fetch(`${API}/api/read?type=daily`);
      data = await r.json();
    } else if (bookId === 'channels') {
      const r = await fetch(`${API}/api/read?type=channels`);
      data = await r.json();
    }
    state.data = data;
    render();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="empty">加载失败：${e.message}</div>`;
  }
}

function openEntry(index) {
  state.page = 'detail';
  state.entry = state.data[index];
  render();
  window.scrollTo(0, 0);
}

async function openChannel(name) {
  state.page = 'channel-detail';
  state.channelName = name;
  state.channelContent = null;
  render();
  try {
    const r = await fetch(`${API}/api/read?type=channels&channel=${encodeURIComponent(name)}`);
    const d = await r.json();
    state.channelContent = d.content;
    render();
    window.scrollTo(0, 0);
  } catch (e) {}
}

function goBack() {
  if (state.page === 'detail' || state.page === 'channel-detail') {
    state.page = 'list';
    state.entry = null;
    render();
  } else {
    state.page = 'shelf';
    state.book = null;
    state.data = null;
    render();
  }
}

function render() {
  const app = document.getElementById('app');

  if (state.page === 'shelf') {
    app.innerHTML = renderShelf();
    return;
  }

  const title = state.page === 'channel-detail' ? state.channelName : (state.book?.title || '');
  const topbar = `
    <div class="topbar">
      <button class="back-btn" onclick="goBack()">‹</button>
      <div class="topbar-title">${escapeHtml(title)}</div>
    </div>
  `;

  if (state.page === 'list') {
    if (!state.data) {
      app.innerHTML = topbar + '<div class="loading">加载中</div>';
    } else {
      app.innerHTML = topbar + renderList(state.book, state.data);
    }
    return;
  }

  if (state.page === 'detail') {
    app.innerHTML = topbar + `<div class="detail-page">${renderDetail(state.book, state.entry)}</div>`;
    return;
  }

  if (state.page === 'channel-detail') {
    const content = state.channelContent !== null
      ? `<div class="detail-page"><div class="detail-content">${renderContentSafe(state.channelContent)}</div></div>`
      : '<div class="loading">加载中</div>';
    app.innerHTML = topbar + content;
    return;
  }
}

render();
</script>
</body>
</html>
